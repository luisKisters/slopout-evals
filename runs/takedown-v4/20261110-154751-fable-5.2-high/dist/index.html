<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Burnout Rush</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; font-family: Impact, 'Arial Black', 'Helvetica Neue', sans-serif; font-style: italic; text-shadow: 0 3px 0 #000, 0 0 12px rgba(0,0,0,.7); user-select: none; }
  .box { position: absolute; }
  #pos { left: 3vw; top: 3vh; font-size: 9vh; line-height: 1; }
  #pos small { font-size: 4vh; color: #ffc928; }
  #pos sup { font-size: 4vh; }
  #lap { right: 3vw; top: 3vh; font-size: 5vh; text-align: right; line-height: 1.1; }
  #lap b { color: #ffc928; font-weight: normal; }
  #lap .t { font-size: 3vh; color: #ddd; }
  #td { right: 3vw; top: 15vh; font-size: 3.2vh; text-align: right; color: #ff7a1a; }
  #speed { right: 3vw; bottom: 3vh; font-size: 12vh; line-height: .9; text-align: right; }
  #speed small { font-size: 3.2vh; color: #ffc928; display: block; }
  #boostwrap { left: 3vw; bottom: 4vh; width: 34vw; }
  #boostlabel { font-size: 3vh; color: #ffc928; letter-spacing: .1em; }
  #boostbar { height: 3.6vh; border: 3px solid #fff; transform: skewX(-20deg); background: rgba(0,0,0,.55); box-shadow: 0 3px 0 #000; overflow: hidden; }
  #boostfill { height: 100%; width: 0%; background: linear-gradient(90deg, #ff3b00, #ffb300 60%, #fff27a); }
  #boostbar.on #boostfill { background: linear-gradient(90deg, #00b7ff, #9af1ff 60%, #fff); box-shadow: 0 0 20px #5cf; }
  #boostbar.on { border-color: #9af1ff; }
  #card { left: 0; right: 0; top: 24vh; text-align: center; font-size: 15vh; letter-spacing: .02em; opacity: 0; }
  #card.takedown { color: #ffd21f; -webkit-text-stroke: 3px #b01800; text-shadow: 0 6px 0 #b01800, 0 0 40px #ff5a00; animation: slam 1.5s cubic-bezier(.2,1.6,.4,1) forwards; }
  #card.crashed { color: #ff3520; -webkit-text-stroke: 2px #300; animation: slam 1.4s ease-out forwards; }
  #card.go { color: #6dff5a; -webkit-text-stroke: 2px #063; animation: slam 1.3s ease-out forwards; }
  #card.info { color: #9af1ff; font-size: 7vh; top: 32vh; animation: slam 1.1s ease-out forwards; }
  @keyframes slam { 0% { opacity: 0; transform: scale(3.2) rotate(-8deg); } 12% { opacity: 1; transform: scale(.92) rotate(-3deg); } 20% { transform: scale(1.06) rotate(-4deg); } 28% { transform: scale(1) rotate(-3deg); } 75% { opacity: 1; transform: scale(1.03) rotate(-3deg) translateX(0); } 100% { opacity: 0; transform: scale(1.1) rotate(-3deg) translateX(60vw) skewX(-30deg); } }
  #sub { left: 0; right: 0; top: 43vh; text-align: center; font-size: 4vh; color: #fff; opacity: 0; }
  #sub.show { animation: slam 1.5s ease-out forwards; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
  #lines { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse at 50% 55%, rgba(0,0,0,0) 45%, rgba(120,200,255,.28) 100%); }
  #result { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,.55); }
  #result h1 { font-size: 16vh; margin: 0; color: #ffd21f; -webkit-text-stroke: 3px #b01800; font-weight: normal; }
  #result h2 { font-size: 5vh; margin: 1vh; font-weight: normal; }
  #result p { font-size: 4vh; color: #9af1ff; animation: blink 1s infinite; }
  #result ol { font-size: 2.8vh; font-style: normal; font-family: 'Arial Black', sans-serif; margin: 1vh; padding: 0; list-style: none; columns: 2; column-gap: 5vw; }
  #result li.me { color: #ffd21f; }
  @keyframes blink { 50% { opacity: .35; } }
  #help { left: 0; right: 0; bottom: 1vh; text-align: center; font-size: 2vh; font-style: normal; font-family: sans-serif; opacity: .75; text-shadow: 0 1px 2px #000; }
  #wrong { left: 0; right: 0; top: 14vh; text-align: center; font-size: 6vh; color: #ff3520; display: none; }
</style>
  <script type="module" crossorigin src="/assets/index-ByeCG30R.js"></script>
</head>
<body>
<div id="hud">
  <div id="lines"></div>
  <div id="flash"></div>
  <div class="box" id="pos">1<sup>st</sup><small> /8</small></div>
  <div class="box" id="lap">LAP <b>1</b>/3<div class="t">0:00.0</div></div>
  <div class="box" id="td">TAKEDOWNS 0</div>
  <div class="box" id="speed">0<small>KM/H</small></div>
  <div class="box" id="boostwrap"><div id="boostlabel">BOOST</div><div id="boostbar"><div id="boostfill"></div></div></div>
  <div class="box" id="card"></div>
  <div class="box" id="sub"></div>
  <div class="box" id="wrong">WRONG WAY</div>
  <div class="box" id="help">W/↑ gas · S/↓ brake · A/D steer · SHIFT+steer drift · SPACE boost</div>
  <div id="result"><h1 id="rpos">1st</h1><h2 id="rtext"></h2><ol id="rlist"></ol><p>PRESS R TO RESTART</p></div>
</div>
</body>
</html>
